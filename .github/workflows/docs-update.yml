# Auto-Update Docs
#
# Triggered by source repos (automem, mcp-automem, automem-graph-viewer)
# on release, or manually via workflow_dispatch.
#
# Docs follow published releases only: a dispatch for a commit that is not a
# published release is skipped.
#
# Flow:
# 1. A source repo publishes a release and docs-dispatch.yml fires a docs-update event
# 2. This workflow checks out the source at the release SHA
# 3. prepare-docs-branch.sh checks out the repo's rolling docs/audit-<repo>
#    branch and records the release in scripts/docs-source-pins.json
# 4. Claude Code Action reads source changes and updates doc pages
# 5. land-docs-pr.sh runs the tests, commits, opens/updates the PR, and sets
#    the CLEAR/HOLD marker (failing tests hold the PR as a draft)
# 6. Docs Auto-Merge queues eligible docs/audit-* PRs after required checks pass

name: Auto-Update Docs
run-name: Auto-Update Docs - ${{ github.event.client_payload.source_repo || inputs.source_repo }} @ ${{ github.event.client_payload.release_tag || github.event.client_payload.source_sha || inputs.release_tag || 'latest release' }}

on:
  repository_dispatch:
    types: [docs-update]
  workflow_dispatch:
    inputs:
      source_repo:
        description: "Source repo (e.g. verygoodplugins/automem)"
        required: true
        type: choice
        options:
          - verygoodplugins/automem
          - verygoodplugins/mcp-automem
          - verygoodplugins/automem-graph-viewer
      release_tag:
        description: "Release tag to document (defaults to the latest release)"
        required: false
      reason:
        description: "What changed and why docs need updating"
        required: true

# One run per source repo at a time, so two releases never race on the same
# rolling docs branch. `queue: max` keeps every waiting release run (up to 100)
# instead of replacing the pending one, so no release goes undocumented.
concurrency:
  group: docs-update-${{ github.event.client_payload.source_repo || inputs.source_repo }}
  cancel-in-progress: false
  queue: max

jobs:
  update-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so a rolling docs branch can merge main; no persisted
          # credentials, because land-docs-pr.sh pushes with RELEASE_PLEASE_TOKEN
          # (pushes made with GITHUB_TOKEN don't trigger CI on the PR).
          fetch-depth: 0
          persist-credentials: false

      - name: Validate and resolve source payload
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PAYLOAD_SOURCE_REPO: ${{ github.event.client_payload.source_repo }}
          PAYLOAD_SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
          PAYLOAD_RELEASE_TAG: ${{ github.event.client_payload.release_tag }}
          PAYLOAD_RELEASE_VERSION: ${{ github.event.client_payload.release_version }}
          PAYLOAD_REASON: ${{ github.event.client_payload.reason }}
          INPUT_SOURCE_REPO: ${{ inputs.source_repo }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_REASON: ${{ inputs.reason }}
        run: |
          SOURCE_REPO="${PAYLOAD_SOURCE_REPO:-$INPUT_SOURCE_REPO}"
          RELEASE_TAG="${PAYLOAD_RELEASE_TAG:-$INPUT_RELEASE_TAG}"
          RELEASE_VERSION="$PAYLOAD_RELEASE_VERSION"
          REASON="${PAYLOAD_REASON:-${INPUT_REASON:-Automated dispatch from source repo release}}"

          if [ "$SOURCE_REPO" != "verygoodplugins/automem" ] && \
             [ "$SOURCE_REPO" != "verygoodplugins/mcp-automem" ] && \
             [ "$SOURCE_REPO" != "verygoodplugins/automem-graph-viewer" ]; then
            echo "::error::Unsupported source repo: $SOURCE_REPO"
            exit 1
          fi

          # Docs follow published releases. A manual run defaults to the latest
          # release; a dispatch without release metadata counts only when its
          # commit is one of the repo's recent published releases.
          if [ -z "$RELEASE_TAG" ] && [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            RELEASE_TAG=$(gh api "repos/$SOURCE_REPO/releases/latest" -q '.tag_name')
          fi
          if [ -z "$RELEASE_TAG" ] && [ -n "$PAYLOAD_SOURCE_SHA" ]; then
            DISPATCH_SHA=$(gh api "repos/$SOURCE_REPO/commits/$PAYLOAD_SOURCE_SHA" -q '.sha')
            # A push-triggered dispatch can arrive before release-please publishes
            # the release for this commit, so look again for a few minutes.
            for ATTEMPT in 1 2 3 4 5 6; do
              for TAG in $(gh api "repos/$SOURCE_REPO/releases?per_page=10" -q '.[] | select(.draft | not) | .tag_name'); do
                if [ "$(gh api "repos/$SOURCE_REPO/commits/$TAG" -q '.sha')" = "$DISPATCH_SHA" ]; then
                  RELEASE_TAG="$TAG"
                  break
                fi
              done
              if [ -n "$RELEASE_TAG" ]; then
                break
              fi
              if [ "$ATTEMPT" -lt 6 ]; then
                sleep 30
              fi
            done
          fi
          if [ -z "$RELEASE_TAG" ]; then
            echo "::notice::$SOURCE_REPO@${PAYLOAD_SOURCE_SHA:-?} is not a published release; docs follow releases only, so nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! gh api "repos/$SOURCE_REPO/releases/tags/$RELEASE_TAG" -q '.tag_name' >/dev/null; then
            echo "::error::$RELEASE_TAG is not a published release of $SOURCE_REPO"
            exit 1
          fi
          FULL_SHA=$(gh api "repos/$SOURCE_REPO/commits/$RELEASE_TAG" -q '.sha') || {
            echo "::error::Could not resolve release tag '$RELEASE_TAG' in $SOURCE_REPO"
            exit 1
          }
          if [ -z "$RELEASE_VERSION" ]; then
            RELEASE_VERSION="${RELEASE_TAG##*v}"
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "source_repo=$SOURCE_REPO" >> "$GITHUB_OUTPUT"
          echo "source_sha=$FULL_SHA" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          {
            echo "reason<<EOF"
            echo "$REASON"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout source repo
        if: steps.resolve.outputs.skip != 'true'
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.resolve.outputs.source_repo }}
          ref: ${{ steps.resolve.outputs.source_sha }}
          path: .source-repo
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - name: Prepare rolling docs branch
        if: steps.resolve.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          SOURCE_REPO: ${{ steps.resolve.outputs.source_repo }}
          SOURCE_SHA: ${{ steps.resolve.outputs.source_sha }}
          RELEASE_TAG: ${{ steps.resolve.outputs.release_tag }}
          RELEASE_VERSION: ${{ steps.resolve.outputs.release_version }}
        run: bash .github/scripts/prepare-docs-branch.sh

      - name: Setup Node.js
        if: steps.resolve.outputs.skip != 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        if: steps.resolve.outputs.skip != 'true'
        run: npm ci

      - name: Run Claude Code
        if: steps.resolve.outputs.skip != 'true'
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          branch_prefix: docs/audit-
          prompt: |
            Read the file .github/prompts/update-docs.md for full instructions.

            Source repo: ${{ steps.resolve.outputs.source_repo }}
            Source SHA: ${{ steps.resolve.outputs.source_sha }}
            Release: ${{ steps.resolve.outputs.release_tag }} (version ${{ steps.resolve.outputs.release_version }})
            Base SHA: ${{ github.event.client_payload.base_sha || 'N/A' }}
            Head SHA: ${{ github.event.client_payload.head_sha || steps.resolve.outputs.source_sha }}
            Changed files: ${{ toJSON(github.event.client_payload.changed_files) || 'See reason below' }}
            Affected doc pages: ${{ toJSON(github.event.client_payload.affected_docs) || 'Determine from file-doc-map.json and reason' }}
            Mapping status: ${{ github.event.client_payload.mapping_status || 'matched' }}
            Commit URL: ${{ github.event.client_payload.commit_url || 'N/A' }}
            Compare URL: ${{ github.event.client_payload.compare_url || 'N/A' }}
            Reason: ${{ steps.resolve.outputs.reason }}

            The source repo is checked out at .source-repo/ for you to read.
            For git inspection, use only these allowed forms: `git status --short`, `git --no-pager diff --no-ext-diff`, `git --no-pager log --no-ext-diff`, `git --no-pager show --no-ext-diff`, and `git rev-parse`.
            After making changes, run `npm test` and `npm run build`; the workflow re-runs the tests and holds the PR as a draft if they fail.

            Return the structured audit JSON (confidence, title, fixes, questions).
            Do NOT create a pull request — the workflow lands the branch.
          claude_args: >-
            --model claude-sonnet-4-6
            --max-turns 100
            --allowedTools 'Read'
            --allowedTools 'MultiEdit'
            --allowedTools 'Edit'
            --allowedTools 'Write'
            --allowedTools 'Glob'
            --allowedTools 'Grep'
            --allowedTools 'Bash(git status)'
            --allowedTools 'Bash(git status --short:*)'
            --allowedTools 'Bash(git --no-pager diff --no-ext-diff:*)'
            --allowedTools 'Bash(git --no-pager log --no-ext-diff:*)'
            --allowedTools 'Bash(git --no-pager show --no-ext-diff:*)'
            --allowedTools 'Bash(git rev-parse:*)'
            --allowedTools 'Bash(npm run build)'
            --allowedTools 'Bash(npm test)'
            --json-schema '{"type":"object","properties":{"confidence":{"type":"string","enum":["CLEAR","HOLD","NO_CHANGES"]},"title":{"type":"string"},"fixes":{"type":"array","items":{"type":"object","properties":{"claim":{"type":"string"},"current":{"type":"string"},"fix":{"type":"string"},"source_sha":{"type":"string"}},"required":["claim","fix"]}},"questions":{"type":"array","items":{"type":"string"}}},"required":["confidence","title","fixes","questions"]}'

      - name: Land docs PR
        if: steps.resolve.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          SOURCE_REPO: ${{ steps.resolve.outputs.source_repo }}
          SOURCE_SHA: ${{ steps.resolve.outputs.source_sha }}
          RELEASE_TAG: ${{ steps.resolve.outputs.release_tag }}
          STRUCTURED_OUTPUT: ${{ steps.claude.outputs.structured_output }}
          PUSH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          DOCS_MAINTAINER: "@jgarturo"
        run: bash .github/scripts/land-docs-pr.sh
